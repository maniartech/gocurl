name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Competitive benchmarks (resty/req) run weekly, off the PR path, since they
    # pull a heavy vendor graph and the numbers are diagnostic, not a merge gate.
    - cron: '0 6 * * 1'

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Minimum supported toolchain plus the current stable release. This
        # catches compatibility regressions without freezing CI two releases back.
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^book2/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race, hermetic)
        run: go test -short -race -timeout 240s ./...

      - name: Coverage (aggregate + critical-path floors)
        run: |
          # -count=1 is REQUIRED: without it, cached packages reuse stale coverage
          # profiles and the -coverpkg merge reports an artificially low, variable
          # total (~76.9% vs the true 80.8%), which can spuriously breach the floor.
          go test -short -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
          bash scripts/check-coverage.sh coverage.out
          go test -count=1 -coverprofile=options-coverage.out ./options
          bash scripts/check-package-coverage.sh options-coverage.out 90.0 options
          go test -count=1 -coverprofile=proxy-coverage.out ./proxy
          bash scripts/check-package-coverage.sh proxy-coverage.out 65.0 proxy

      - name: Fuzz smoke (30s per target)
        run: |
          go test -run='^$' -fuzz='FuzzTokenize$' -fuzztime=30s ./tokenizer/
          go test -run='^$' -fuzz='FuzzParseCommand$' -fuzztime=30s .

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l . | Where-Object { $_ -notlike 'book2/*' -and $_ -notlike 'book2\*' }
          if ($unformatted) {
            $unformatted
            throw 'gofmt check failed'
          }
      - name: Build and test
        run: |
          go vet ./...
          go build ./...
          go test -short -count=1 ./...

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  benchmarks:
    # Benchmarks run without -race (which perturbs timing/allocs) on a single pinned
    # Go version so numbers stay comparable. This is a SMOKE: every benchmark runs
    # once and must not error. Performance numbers themselves are recorded in
    # docs/benchmarking.md via `-count=10` + benchstat, not gated on time here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Benchmark smoke (no -race, run once)
        run: go test -run='^$' -bench=. -benchmem -benchtime=1x ./...

  performance-gates:
    # These tests intentionally do real I/O or run testing.Benchmark internally,
    # so they are excluded by -short in the main race job and enforced here.
    # Timing is advisory; allocation and byte ceilings are hard merge gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Hot-path allocation and byte budgets
        run: >-
          go test -count=1 -run
          '^(TestAllocBudget_Do|TestByteBudget_Do|TestCompositionPerformance_Budgets)$'
          -v .

  competitive-benchmarks:
    # Scheduled only (cron) — never on PRs. Runs the separate benchcmp module's
    # gocurl-vs-net/http-vs-resty-vs-req arms over the shared fair transport and
    # publishes the numbers as a workflow artifact. allocs/B regressions on
    # gocurl's OWN path are gated in the normal test job (TestAllocBudget_Do);
    # this job is the cross-client diagnostic that backs docs/benchmarking.md.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run competitive arms (count=10)
        working-directory: benchcmp
        run: |
          go test -run '^TestCompetitiveOverheadBudgets$' -count=1 -v .
          # BenchmarkOverhead_* (stub transport) is the reliable client-overhead
          # comparison; BenchmarkCmp_* (real loopback) is end-to-end realism, ns/op
          # advisory (network-dominated). See docs/benchmarking.md.
          go test -run='^$' -bench='Benchmark(Overhead|Cmp)' -benchmem -count=10 . | tee bench-new.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: competitive-benchmarks
          path: benchcmp/bench-new.txt

  soak:
    # Scheduled only — the soak loop (both arms) and backpressure test are too slow
    # for the PR path. GOCURL_SOAK gives each arm a wall-clock budget.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Soak (10 min/arm) + backpressure
        env:
          GOCURL_SOAK: 10m
        run: go test -run 'TestClient_Soak' -timeout 30m -v .

  fuzz-long:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Parser fuzz (5 minutes)
        run: go test -run='^$' -fuzz='FuzzParseCommand$' -fuzztime=5m .
      - name: Tokenizer fuzz (5 minutes)
        run: go test -run='^$' -fuzz='FuzzTokenize$' -fuzztime=5m ./tokenizer/
